<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>RIVINS Guardian — Dashboard</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; padding: 24px; }
  h1 { color: #ff4d5e; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: #181b22; border: 1px solid #262a33; border-radius: 8px; padding: 16px; }
  .critical { border-left: 4px solid #ed4245; }
  .warning { border-left: 4px solid #f5a623; }
  .info { border-left: 4px solid #5865f2; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #262a33; }
  .sev-critical { color: #ed4245; font-weight: bold; }
  .sev-warning { color: #f5a623; }
  .sev-info { color: #8a8f98; }
</style>
</head>
<body>
  <h1>🛡️ RIVINS Guardian</h1>
  <p>Live overzicht — alleen zichtbaar voor toegestane accounts. Ververst elke 15s.</p>

  <div class="grid" id="stats"></div>

  <h2>Kritieke meldingen (laatste 100)</h2>
  <table id="critical-table">
    <thead><tr><th>Tijd</th><th>Type</th><th>Actor</th><th>Detail</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2 style="margin-top:32px">Alle recente events</h2>
  <table id="events-table">
    <thead><tr><th>Tijd</th><th>Type</th><th>Severity</th><th>Actor</th><th>Kanaal</th></tr></thead>
    <tbody></tbody>
  </table>

<script>
async function load() {
  const [events, critical, stats] = await Promise.all([
    fetch('/api/events?limit=150').then(r => r.json()),
    fetch('/api/events/critical').then(r => r.json()),
    fetch('/api/stats').then(r => r.json()),
  ]);

  document.getElementById('stats').innerHTML = stats.totals.map(t => `
    <div class="card"><h3>${t.type}</h3><p style="font-size:28px;margin:0">${t.count}</p><small>laatste 24u</small></div>
  `).join('') || '<p>Nog geen data.</p>';

  document.querySelector('#critical-table tbody').innerHTML = critical.map(e => `
    <tr><td>${new Date(e.created_at).toLocaleString('nl-NL')}</td><td>${e.type}</td><td>${e.actor_id || '-'}</td><td><pre style="white-space:pre-wrap;margin:0">${e.detail || ''}</pre></td></tr>
  `).join('') || '<tr><td colspan="4">Geen kritieke meldingen. Mooi zo.</td></tr>';

  document.querySelector('#events-table tbody').innerHTML = events.map(e => `
    <tr><td>${new Date(e.created_at).toLocaleString('nl-NL')}</td><td>${e.type}</td><td class="sev-${e.severity}">${e.severity}</td><td>${e.actor_id || '-'}</td><td>${e.channel_id || '-'}</td></tr>
  `).join('');
}
load();
setInterval(load, 15000);
</script>
</body>
</html>
